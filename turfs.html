<!DOCTYPE html>
<html>
<head>
    <title>BookBox - Turfs</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        header {
            background: #0f9d58;
            color: white;
            padding: 15px 30px;
        }

        .title {
            text-align: center;
            margin: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card h3 {
            margin: 10px;
        }

        .card p {
            margin: 0 10px 10px;
            color: #555;
        }

        .card button {
            margin: 10px;
            padding: 10px;
            width: calc(100% - 20px);
            background: #0f9d58;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>

</head>

<body>

<header>
    <h1>🏏 BookBox</h1>
</header>

<h2 class="title">Available Turfs</h2>

<div class="grid">

    <div class="card">
        <img src="image1.jpg">
        <h3>Elite Turf</h3>
        <p>Gachibowli • ₹800/hr</p>
        <button>Book Now</button>
    </div>

    <div class="card">
        <img src="image2.jpg">
        <h3>PowerPlay Arena</h3>
        <p>Kukatpally • ₹600/hr</p>
        <button>Book Now</button>
    </div>

    <div class="card">
        <img src="image3.jpg">
        <h3>Urban Cricket Box</h3>
        <p>Madhapur • ₹700/hr</p>
        <button>Book Now</button>
    </div>

</div>

</body>
</html>
